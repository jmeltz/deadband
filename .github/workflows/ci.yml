name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet
        run: go vet ./cmd/... ./pkg/...
      - name: Go test
        run: go test -race ./pkg/...
      - name: Cross-compile release binaries
        run: make release
